name: markermag-nf
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.14
  - pip
  - setuptools

  # Python packages (MarkerMAG runtime dependencies)
  - biopython>=1.78
  - pandas
  - plotly
  - seaborn
  - matplotlib
  - numpy

  # Bioinformatics tools called by MarkerMAG
  - blast>=2.12        # makeblastdb, blastn
  - bowtie2>=2.4       # read mapping
  - samtools>=1.14     # SAM/BAM manipulation
  - barrnap>=0.9       # polish_16s (trim non-16S ends) and barrnap_16s
  - seqtk>=1.3         # subseq/sample operations in MarkerMAG link/copy number
  - spades>=3.15       # metaSPAdes mini-assembly in link round 2
  - hmmer>=3.3         # hmmscan for copy-number GC-bias correction
  - vsearch>=2.21      # 16S clustering

  # Build/runtime dependencies of https://github.com/xvazquezc/matam. Build
  # the fork manually after activating this environment, as documented in the
  # repository README. The incompatible upstream MATAM package is not installed.
  - coreutils
  - curl
  - sed
  - wget
  - git
  - bzip2
  - zlib
  - make
  # Same pin as MATAM's environment.yml (CMake 4 can't configure ovgraphbuild).
  - cmake=3.31.8
  - autoconf
  - automake
  - gxx_linux-64
  - sga
  # Keep this in lockstep with MATAM's tested SortMeRNA ABI and index format.
  - sortmerna>=7,<8
  - seqkit
  - cd-hit
  - rdptools
  - krona
  - exonerate=2.2

  # Pin this to the release commit after the Python 3.14 migration is tagged.
  - pip:
    - git+https://github.com/xvazquezc/MarkerMAG-nf.git@master
