name: markermag-nf
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python<=3.10
  - pip
  - setuptools

  # Python packages (MarkerMAG runtime dependencies)
  - biopython>=1.78
  - pandas
  - plotly
  - seaborn
  - matplotlib
  - numpy

  # Bioinformatics tools called by MarkerMAG
  - blast>=2.12        # makeblastdb, blastn
  - bowtie2>=2.4       # read mapping
  - samtools>=1.14     # SAM/BAM manipulation
  - barrnap>=0.9       # polish_16s (trim non-16S ends) and barrnap_16s
  - seqtk>=1.3         # mergepe (MATAM filter) and subseq (read extraction)
  - spades>=3.15       # metaSPAdes mini-assembly in link round 2
  - hmmer>=3.3         # hmmscan for copy-number GC-bias correction
  - usearch=11         # uclust_16s clustering
  - vsearch>=2.21      # open-source clustering alternative

  # MATAM + SortMeRNA — required for the 16S assembly path
  - matam=1.6.0

  # MarkerMAG Python package — pinned to a known working repository commit.
  # This keeps Nextflow-created environments reproducible and avoids relying
  # on the directory from which `conda env create` is invoked.
  - pip:
    - git+https://github.com/xvazquezc/MarkerMAG-nf.git@6009b7bde55b641171adbbabb9f80053adc12722
