name: markermag-nf
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.14
  - pip
  - setuptools

  # Python packages (MarkerMAG runtime dependencies)
  - biopython>=1.78
  - pandas
  - plotly
  - seaborn
  - matplotlib
  - numpy

  # Bioinformatics tools called by MarkerMAG
  - blast>=2.12        # makeblastdb, blastn
  - bowtie2>=2.4       # read mapping
  - samtools>=1.14     # SAM/BAM manipulation
  - barrnap>=0.9       # polish_16s (trim non-16S ends) and barrnap_16s
  - seqtk>=1.3         # subseq/sample operations in MarkerMAG link/copy number
  - spades>=3.15       # metaSPAdes mini-assembly in link round 2
  - hmmer>=3.3         # hmmscan for copy-number GC-bias correction
  - usearch=11         # uclust_16s clustering
  - vsearch>=2.21      # open-source clustering alternative

  # Runtime dependencies of https://github.com/xvazquezc/matam.
  # Until that fork has a versioned Conda package, build it separately and set
  # --matam_executable to its bin/matam_assembly.py. Do not install Bioconda's
  # upstream matam=1.6.2: it lacks the separate paired-read interface.
  - coreutils
  - curl
  - sed
  - wget
  - git
  - bzip2
  - zlib
  - make
  - cmake
  - autoconf
  - automake
  - gxx_linux-64
  - sga
  - sortmerna>=5
  - seqkit
  - cd-hit
  - rdptools
  - krona
  - exonerate=2.2

  # Pin this to the release commit after the Python 3.14 migration is tagged.
  - pip:
    - git+https://github.com/xvazquezc/MarkerMAG-nf.git@master
